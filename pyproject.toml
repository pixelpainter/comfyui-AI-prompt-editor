[project]
name = "comfyui-ai-prompt-editor"
description = "A full prompt-writing studio inside a single ComfyUI node — AI-powered editing, style targeting, prompt browsing, and wireless prompt injection, all driven by your local Ollama models."
version = "1.0.21"
license = { file = "LICENSE" }
# No hard dependencies. PyAV is needed only for the two video-to-prompt
# routes, which detect its absence and answer with a plain "PyAV is not
# installed" rather than failing obscurely — so requiring it up front made
# every user install a large media library for a feature most never touch.
# To enable video-to-prompt:  pip install "av>=10.0.0,<16"
# The [project.optional-dependencies] extra below also works for source
# installs (`pip install ".[video]"`), but the extra is unreachable from
# ComfyUI Registry installs — the registry does not surface extras.
dependencies = []
requires-python = ">=3.9"
classifiers = ["Operating System :: OS Independent"]

[project.optional-dependencies]
# Upper bound is deliberate: PyAV majors have broken API compatibility before,
# and an unbounded requirement means a future release can break video prompts
# on machines that merely reinstalled.
video = ["av>=10.0.0,<16"]

[project.urls]
Repository = "https://github.com/pixelpainter/comfyui-AI-prompt-editor"
"Bug Tracker" = "https://github.com/pixelpainter/comfyui-AI-prompt-editor/issues"

[tool.comfy]
PublisherId = "pixelpainter"
DisplayName = "Enhanced Prompt Editor"
Icon = "https://raw.githubusercontent.com/pixelpainter/comfyui-AI-prompt-editor/main/assets/icon.png"
