[project]
name = "comfyui-ai-prompt-editor"
description = "A full prompt-writing studio inside a single ComfyUI node — AI-powered editing, style targeting, prompt browsing, and wireless prompt injection, all driven by your local Ollama models."
version = "1.0.18"
license = { file = "LICENSE" }
dependencies = ["av>=10.0.0"]
requires-python = ">=3.9"
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/pixelpainter/comfyui-AI-prompt-editor"
"Bug Tracker" = "https://github.com/pixelpainter/comfyui-AI-prompt-editor/issues"

[tool.comfy]
PublisherId = "pixelpainter"
DisplayName = "Enhanced Prompt Editor"
Icon = "https://raw.githubusercontent.com/pixelpainter/comfyui-AI-prompt-editor/main/assets/icon.png"
